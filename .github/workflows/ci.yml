name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: estateflow
          RABBITMQ_DEFAULT_PASS: estateflow_test_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ENVIRONMENT: test
      ESTATEFLOW_DEBUG: "false"
      RABBITMQ_TEST_URL: amqp://estateflow:estateflow_test_password@127.0.0.1:5672/

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: MyPy
        run: python -m mypy src
      - name: Tests
        run: python -m pytest
